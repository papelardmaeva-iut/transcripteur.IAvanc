<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcripteur Audio IA - Longue Durée</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --container-bg: #ffffff;
            --primary: #4A90E2;
            --primary-hover: #357ABD;
            --text-main: #333333;
            --text-muted: #666666;
            --border: #e1e4e8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #fafbfc;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background-color: #f0f6ff;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            margin-top: 20px;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #a0c4eb; cursor: not-allowed; }
        
        textarea {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.6;
            display: none;
        }
        #statusInfo {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #e8f2fc;
            color: var(--primary);
            font-weight: 500;
        }
        .secondary-btn {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Transcripteur IA (Longue durée)</h1>
        <p>Découpe automatiquement les gros fichiers (1h et +) pour contourner la limite de 25 Mo.</p>

        <div class="form-group">
            <label for="apiKey">Clé API OpenAI :</label>
            <input type="password" id="apiKey" placeholder="sk-...">
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('audioFile').click()">
            <input type="file" id="audioFile" accept="audio/*, video/*" style="display:none">
            <div style="font-size: 24px;">📁</div>
            <p id="fileName">Clique ici pour ajouter ton fichier (sans limite de durée)</p>
        </div>

        <button id="transcribeBtn" disabled>Lancer la transcription</button>
        
        <div id="statusInfo"></div>
        
        <textarea id="result" readonly placeholder="La transcription s'affichera ici au fur et à mesure..."></textarea>
        
        <button id="downloadBtn" class="secondary-btn">⬇️ Télécharger le texte (.txt)</button>
    </div>

    <script>
        const audioFileInput = document.getElementById('audioFile');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const resultArea = document.getElementById('result');
        const statusInfo = document.getElementById('statusInfo');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameDisplay = document.getElementById('fileName');
        
        let selectedFile = null;

        audioFileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileNameDisplay.innerHTML = `<strong>${selectedFile.name}</strong> sélectionné`;
                transcribeBtn.disabled = false;
            }
        });

        // Fonction pour convertir un morceau d'audio en fichier WAV (format non compressé facile à manipuler en JS)
        function audioBufferToWavBlob(buffer, startSample, lengthInSamples) {
            const numOfChan = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const bytesPerSample = 2;
            const blockAlign = numOfChan * bytesPerSample;
            const dataSize = lengthInSamples * blockAlign;
            const bufferSize = 44 + dataSize;
            const arrayBuffer = new ArrayBuffer(bufferSize);
            const view = new DataView(arrayBuffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, numOfChan, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            const channels = [];
            for (let i = 0; i < numOfChan; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offsetOut = 44;
            for (let i = 0; i < lengthInSamples; i++) {
                for (let channel = 0; channel < numOfChan; channel++) {
                    let sample = channels[channel][startSample + i];
                    sample = Math.max(-1, Math.min(1, sample));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offsetOut, sample, true);
                    offsetOut += 2;
                }
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        transcribeBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) { alert("Il te faut une clé API OpenAI !"); return; }
            if (!selectedFile) return;

            transcribeBtn.style.display = 'none';
            statusInfo.style.display = 'block';
            resultArea.style.display = 'block';
            downloadBtn.style.display = 'none';
            resultArea.value = "";

            try {
                // 1. Lire le fichier
                statusInfo.innerHTML = "⏳ Étape 1/3 : Lecture de l'audio (cela peut figer la page quelques secondes)...";
                await new Promise(r => setTimeout(r, 50)); // Laisser le navigateur afficher le texte

                const arrayBuffer = await selectedFile.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                statusInfo.innerHTML = "⏳ Étape 2/3 : Décodage de l'audio...";
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                // 2. Préparer les morceaux (Chunks de 2 minutes)
                const CHUNK_DURATION_SEC = 120; // 2 minutes par fichier pour être sûr de rester < 25Mo
                const totalDuration = audioBuffer.duration;
                const totalChunks = Math.ceil(totalDuration / CHUNK_DURATION_SEC);
                
                statusInfo.innerHTML = `🚀 Étape 3/3 : Découpage et transcription de ${totalChunks} morceaux...`;

                // 3. Traiter chaque morceau un par un
                for (let i = 0; i < totalChunks; i++) {
                    statusInfo.innerHTML = `🎙️ Envoi du morceau ${i + 1} sur ${totalChunks}...`;
                    await new Promise(r => setTimeout(r, 50));

                    const startSample = i * CHUNK_DURATION_SEC * audioBuffer.sampleRate;
                    let lengthInSamples = CHUNK_DURATION_SEC * audioBuffer.sampleRate;
                    if (startSample + lengthInSamples > audioBuffer.length) {
                        lengthInSamples = audioBuffer.length - startSample;
                    }

                    // Créer le petit fichier WAV
                    const chunkBlob = audioBufferToWavBlob(audioBuffer, startSample, lengthInSamples);

                    // L'envoyer à OpenAI
                    const formData = new FormData();
                    formData.append('file', chunkBlob, `partie_${i}.wav`);
                    formData.append('model', 'whisper-1');

                    const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${apiKey}` },
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok) {
                        resultArea.value += data.text + " ";
                        resultArea.scrollTop = resultArea.scrollHeight; // Descendre automatiquement l'ascenseur
                    } else {
                        throw new Error(data.error?.message || "Erreur de l'API");
                    }
                }

                statusInfo.innerHTML = "✅ Transcription terminée avec succès !";
                statusInfo.style.backgroundColor = "#e6ffed";
                statusInfo.style.color = "#1a7f37";
                downloadBtn.style.display = 'block';

            } catch (error) {
                statusInfo.innerHTML = "❌ Erreur : " + error.message;
                statusInfo.style.backgroundColor = "#ffebe9";
                statusInfo.style.color = "#cf222e";
                transcribeBtn.style.display = 'block';
            }
        });

        downloadBtn.addEventListener('click', () => {
            const text = resultArea.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Transcription_Complete.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
