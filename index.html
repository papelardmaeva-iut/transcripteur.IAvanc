<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcripteur Groq - Version Finale</title>
    <style>
        :root {
            --bg-color: #f3f0ff;
            --container-bg: #ffffff;
            --primary: #6b46c1; /* Violet distinct pour différencier de l'ancien code */
            --primary-hover: #553c9a;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(107, 70, 193, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: var(--primary);
        }
        p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #faf5ff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            background-color: #f3ebff;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #b794f4; cursor: not-allowed; }
        
        textarea {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.6;
            display: none;
        }
        #statusInfo {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #ebf8ff;
            color: #2b6cb0;
            font-weight: 500;
        }
        .secondary-btn {
            background-color: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            display: none;
        }
        .secondary-btn:hover {
            background-color: #faf5ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🟣 Transcripteur Groq (Gratuit)</h1>
        <p>Ce site utilise les serveurs ultra-rapides de Groq. Détection automatique du français et de l'espagnol.</p>

        <div class="form-group">
            <label for="apiKey">Clé API Groq (commence par gsk_) :</label>
            <input type="password" id="apiKey" placeholder="gsk_...">
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('audioFile').click()">
            <input type="file" id="audioFile" accept="audio/*, video/*" style="display:none">
            <div style="font-size: 28px; margin-bottom: 10px;">📁</div>
            <strong id="fileName">Clique ici pour ajouter ton fichier audio</strong>
        </div>

        <button id="transcribeBtn" disabled>🚀 Lancer la transcription</button>
        
        <div id="statusInfo"></div>
        
        <textarea id="result" readonly placeholder="La transcription s'affichera ici au fur et à mesure..."></textarea>
        
        <button id="downloadBtn" class="secondary-btn">⬇️ Télécharger le texte (.txt)</button>
    </div>

    <script>
        const audioFileInput = document.getElementById('audioFile');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const resultArea = document.getElementById('result');
        const statusInfo = document.getElementById('statusInfo');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameDisplay = document.getElementById('fileName');
        
        let selectedFile = null;

        audioFileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileNameDisplay.innerHTML = `${selectedFile.name}`;
                transcribeBtn.disabled = false;
            }
        });

        // Fonction pour convertir en WAV (standard audio)
        function audioBufferToWavBlob(buffer, startSample, lengthInSamples) {
            const numOfChan = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const bytesPerSample = 2;
            const blockAlign = numOfChan * bytesPerSample;
            const dataSize = lengthInSamples * blockAlign;
            const bufferSize = 44 + dataSize;
            const arrayBuffer = new ArrayBuffer(bufferSize);
            const view = new DataView(arrayBuffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numOfChan, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            const channels = [];
            for (let i = 0; i < numOfChan; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offsetOut = 44;
            for (let i = 0; i < lengthInSamples; i++) {
                for (let channel = 0; channel < numOfChan; channel++) {
                    let sample = channels[channel][startSample + i];
                    sample = Math.max(-1, Math.min(1, sample));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offsetOut, sample, true);
                    offsetOut += 2;
                }
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        transcribeBtn.addEventListener('click', async () => {
            // Nettoyage ultra-strict de la clé API
            const rawKey = apiKeyInput.value;
            const apiKey = rawKey.replace(/[^\x20-\x7E]/g, "").trim();

            if (!apiKey.startsWith("gsk_")) { 
                alert("Attention : Ta clé doit commencer par gsk_ (Clé Groq)."); 
                return; 
            }
            if (!selectedFile) return;

            transcribeBtn.style.display = 'none';
            statusInfo.style.display = 'block';
            resultArea.style.display = 'block';
            downloadBtn.style.display = 'none';
            resultArea.value = "";

            try {
                statusInfo.innerHTML = "⏳ Préparation du fichier audio (cela peut prendre quelques secondes)...";
                await new Promise(r => setTimeout(r, 100));

                const arrayBuffer = await selectedFile.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                statusInfo.innerHTML = "⏳ Analyse audio en cours...";
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                // Découpage en morceaux de 3 minutes (180 secondes)
                const CHUNK_DURATION_SEC = 120;
                const totalDuration = audioBuffer.duration;
                const totalChunks = Math.ceil(totalDuration / CHUNK_DURATION_SEC);
                
                statusInfo.innerHTML = `🚀 Découpage terminé. Lancement des ${totalChunks} morceaux vers Groq...`;

                for (let i = 0; i < totalChunks; i++) {
                    statusInfo.innerHTML = `⚡ Traitement : Morceau ${i + 1} sur ${totalChunks}...`;
                    
                    const startSample = i * CHUNK_DURATION_SEC * audioBuffer.sampleRate;
                    let lengthInSamples = CHUNK_DURATION_SEC * audioBuffer.sampleRate;
                    if (startSample + lengthInSamples > audioBuffer.length) {
                        lengthInSamples = audioBuffer.length - startSample;
                    }

                    const chunkBlob = audioBufferToWavBlob(audioBuffer, startSample, lengthInSamples);

                    const formData = new FormData();
                    formData.append('file', chunkBlob, `partie_${i}.wav`);
                    formData.append('model', 'whisper-large-v3'); 

                    // L'URL pointe bien vers GROQ cette fois-ci !
                    const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${apiKey}` 
                        },
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok) {
                        resultArea.value += data.text + "\n\n";
                        resultArea.scrollTop = resultArea.scrollHeight;
                    } else {
                        throw new Error(data.error?.message || "L'API a refusé la connexion.");
                    }
                }

                statusInfo.innerHTML = "✅ Terminé avec succès !";
                statusInfo.style.backgroundColor = "#c6f6d5";
                statusInfo.style.color = "#22543d";
                downloadBtn.style.display = 'block';

            } catch (error) {
                statusInfo.innerHTML = "❌ Erreur : " + error.message;
                statusInfo.style.backgroundColor = "#fed7d7";
                statusInfo.style.color = "#9b2c2c";
                transcribeBtn.style.display = 'block';
            }
        });

        downloadBtn.addEventListener('click', () => {
            const text = resultArea.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Transcription_Groq.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
